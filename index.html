<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fuel Finder — Brisbane ULP95</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ════════════ CSS VARIABLES — THEME SYSTEM ════════════ */
:root, [data-theme="dark"] { --bg: #0b0e14; --surface: #141820; --card: #1c2130; --border: #2a3040; --text: #e8ecf4; --text-dim: #8892a8; --text-muted: #5a6478; --green: #34d399; --yellow: #fbbf24; --red: #f87171; --accent: #60a5fa; --toast-bg: #7f1d1d; --toast-text: #fca5a5; --toast-border: #991b1b; --shadow: rgba(0,0,0,0.5); --color-save: #f59e0b; }
[data-theme="light"] { --bg: #f4f6f9; --surface: #ffffff; --card: #eef1f6; --border: #d0d5dd; --text: #1a1d24; --text-dim: #5a6478; --text-muted: #9aa2b0; --green: #059669; --yellow: #d97706; --red: #dc2626; --accent: #2563eb; --toast-bg: #fee2e2; --toast-text: #991b1b; --toast-border: #fecaca; --shadow: rgba(0,0,0,0.1); --color-save: #d97706; }
@media (prefers-color-scheme: light) { [data-theme="system"] { --bg: #f4f6f9; --surface: #ffffff; --card: #eef1f6; --border: #d0d5dd; --text: #1a1d24; --text-dim: #5a6478; --text-muted: #9aa2b0; --green: #059669; --yellow: #d97706; --red: #dc2626; --accent: #2563eb; --toast-bg: #fee2e2; --toast-text: #991b1b; --toast-border: #fecaca; --shadow: rgba(0,0,0,0.1); --color-save: #d97706; } }

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
button { font-family: inherit; }
input { font-family: inherit; }
/* Min tap targets for mobile */
button, .clickable { min-height: 44px; }

/* ════════════ LANDING ════════════ */
#landing { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); padding: 32px 20px; gap: 16px; transition: opacity 0.3s; }
#landing.hidden { opacity: 0; pointer-events: none; }
#landing h1 { font-size: 24px; font-weight: 700; text-align: center; }
#landing p { font-size: 14px; color: var(--text-dim); text-align: center; max-width: 280px; line-height: 1.5; }
.landing-btn { width: 100%; max-width: 320px; padding: 20px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 17px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 12px; }
.landing-btn:hover { background: var(--card); border-color: var(--accent); }
.landing-btn .icon { font-size: 28px; }
.landing-btn .sub { font-size: 12px; color: var(--text-dim); font-weight: 400; margin-top: 2px; }
#settings-gear { position: absolute; top: 16px; right: 16px; background: none; border: none; color: var(--text-dim); font-size: 24px; cursor: pointer; z-index: 11; padding: 8px; }
#settings-gear:hover { color: var(--text); }

#enroute-container { width: 100%; max-width: 320px; }
#enroute-btn.hidden { display: none; }
#landing-dest-wrap { display: none; width: 100%; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
#landing-dest-wrap.visible { display: flex; align-items: stretch; }
#landing-dest-wrap:focus-within { border-color: var(--accent); }
#landing-dest-input { flex: 1; min-width: 0; background: transparent; border: none; padding: 20px 14px; color: var(--text); font-size: 17px; font-weight: 600; outline: none; }
#landing-dest-input::placeholder { color: var(--text-dim); }
#landing-dest-cancel { background: transparent; border: none; color: var(--text-dim); width: 44px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
#landing-dest-cancel:hover { color: var(--text); }
#landing-dest-submit { background: var(--accent); color: #fff; border: none; border-radius: 6px; margin: 8px; padding: 0 18px; font-size: 15px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
[data-theme="dark"] #landing-dest-submit, [data-theme="system"] #landing-dest-submit { color: #000; }
#landing-ac-list { position: absolute; top: 100%; left: 0; right: 0; z-index: 20; background: var(--surface); border: 1px solid var(--border); border-radius: 0 0 var(--radius) var(--radius); max-height: 200px; overflow-y: auto; display: none; }
#landing-ac-list.visible { display: block; }
#landing-ac-list div { padding: 12px 14px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--border); }
#landing-ac-list div:hover { background: var(--card); }
#landing-ac-list .ac-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
/* Saved destinations in landing dropdown */
.saved-dest-header { padding: 10px 14px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); pointer-events: none; }
.saved-dest-item { display: flex; align-items: center; justify-content: space-between; }
.saved-dest-item .dest-icon { font-size: 16px; margin-right: 8px; }
.saved-dest-item .dest-info { flex: 1; }
.saved-dest-item .dest-name { font-size: 14px; font-weight: 600; }
.saved-dest-item .dest-addr { font-size: 11px; color: var(--text-dim); }

/* ════════════ MAP ════════════ */
#map { position: absolute; top: 0; left: 0; right: 0; bottom: 260px; z-index: 1; display: none; background: var(--bg); }
#map.visible { display: block; }
#map .leaflet-control-zoom { position: fixed; bottom: 275px; right: 12px; z-index: 3; }
#map .leaflet-control-zoom a { background: var(--surface); color: var(--text); border-color: var(--border); }
#map .leaflet-control-zoom a:hover { background: var(--card); }
.leaflet-popup-content-wrapper { background: var(--card); color: var(--text); border-radius: var(--radius); border: 1px solid var(--border); }
.leaflet-popup-tip { background: var(--card); border: 1px solid var(--border); }
.popup-content { min-width: 200px; }
.popup-content h3 { font-size: 14px; margin-bottom: 4px; }
.popup-content .addr { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; }
.popup-row { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; padding: 2px 0; }
.popup-row span:first-child { color: var(--text-dim); }
.popup-nav { width: 100%; margin-top: 10px; background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
[data-theme="dark"] .popup-nav, [data-theme="system"] .popup-nav { color: #000; }
.popup-nav:hover { opacity: 0.85; }
.number-marker { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #fff; box-shadow: 0 2px 8px var(--shadow); }
.number-marker.top1 { background: #f59e0b; }
.number-marker.top2 { background: #64748b; }
.number-marker.top3 { background: #d97706; }
.number-marker.other { display: none; }

/* ════════════ TOP BAR ════════════ */
#top-bar { display: none; position: absolute; top: 0; left: 0; right: 0; z-index: 3; padding: 12px; gap: 8px; align-items: center; background: linear-gradient(180deg, var(--bg) 60%, transparent); }
#top-bar.visible { display: flex; }
#back-btn { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; color: var(--text); font-size: 16px; cursor: pointer; line-height: 1; flex-shrink: 0; }
#back-btn:hover { background: var(--card); }
#mode-label { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
#dest-field { flex: 1; display: none; position: relative; }
#dest-field.visible { display: block; }
#dest-field input { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 42px 10px 14px; color: var(--text); font-size: 13px; outline: none; }
#dest-field input:focus { border-color: var(--accent); }
#dest-go { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
[data-theme="dark"] #dest-go, [data-theme="system"] #dest-go { color: #000; }
#autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; z-index: 20; background: var(--surface); border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--radius) var(--radius); max-height: 200px; overflow-y: auto; display: none; }
#autocomplete-list.visible { display: block; }
#autocomplete-list div { padding: 12px 14px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--border); }
#autocomplete-list div:hover { background: var(--card); }
#autocomplete-list .ac-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

/* ════════════ LOADING / TOAST ════════════ */
#loading { display: none; position: absolute; top: 60px; left: 50%; transform: translateX(-50%); z-index: 4; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 20px; font-size: 13px; color: var(--text-dim); }
#loading.visible { display: flex; align-items: center; gap: 8px; }
.spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#toast { display: none; position: absolute; bottom: 275px; left: 12px; right: 12px; z-index: 5; background: var(--toast-bg); color: var(--toast-text); border: 1px solid var(--toast-border); border-radius: var(--radius); padding: 14px 16px; font-size: 13px; }
#toast.visible { display: block; }

/* ════════════ PANEL ════════════ */
#panel { display: none; position: absolute; bottom: 0; left: 0; right: 0; height: 260px; z-index: 2; background: var(--surface); border-top: 1px solid var(--border); flex-direction: column; }
#panel.visible { display: flex; }
#panel.expanded { height: 70vh; }
#panel-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; min-height: 44px; }
#panel-title { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 8px; }
#panel-toggle { background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; padding: 4px; flex-shrink: 0; min-height: auto; }
#panel-toggle:hover { color: var(--text); }
#panel-body { flex: 1; overflow-y: auto; padding: 4px 0; -webkit-overflow-scrolling: touch; }

.station-card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
.station-card:hover { background: var(--card); }
.station-card:last-child { border-bottom: none; }
.station-rank { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
.rank-1 { background: #f59e0b; color: #000; } .rank-2 { background: #64748b; color: #fff; } .rank-3 { background: #d97706; color: #000; }
.station-info { flex: 1; min-width: 0; }
.station-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.station-address { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.station-savings { font-size: 13px; font-weight: 700; margin-top: 2px; }
.station-savings.save { color: var(--green); }
.station-savings.neutral { color: var(--text-dim); }
.station-savings.cost { color: var(--red); }
.station-meta { display: flex; gap: 8px; margin-top: 2px; font-size: 11px; color: var(--text-dim); }
.station-nav-btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
[data-theme="dark"] .station-nav-btn, [data-theme="system"] .station-nav-btn { color: #000; }

/* ════════════ SETTINGS DRAWER ════════════ */
#settings-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.5); display: none; }
#settings-overlay.visible { display: block; }
#settings-drawer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 101; background: var(--surface); border-top: 1px solid var(--border); border-radius: 16px 16px 0 0; max-height: 85vh; overflow-y: auto; display: none; flex-direction: column; }
#settings-drawer.visible { display: flex; }
#settings-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--text-muted); margin: 12px auto 8px; flex-shrink: 0; }
#settings-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 20px 12px; flex-shrink: 0; }
#settings-header h2 { font-size: 18px; font-weight: 600; }
#settings-close { background: none; border: none; color: var(--text-dim); font-size: 22px; cursor: pointer; padding: 8px; min-height: auto; }
#settings-body { padding: 0 20px 24px; }
.setting-group { margin-bottom: 24px; }
.setting-group-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 12px; }
.setting-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); min-height: 48px; }
.setting-row:last-child { border-bottom: none; }
.setting-label { font-size: 14px; font-weight: 500; }
.setting-desc { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
/* Theme buttons */
.theme-chips { display: flex; gap: 8px; }
.theme-chip { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); color: var(--text-dim); font-size: 13px; cursor: pointer; }
.theme-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
/* Toggle switch */
.toggle { position: relative; width: 48px; height: 28px; flex-shrink: 0; cursor: pointer; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider { position: absolute; inset: 0; background: var(--border); border-radius: 14px; transition: 0.2s; }
.toggle-slider::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; background: var(--text); border-radius: 50%; transition: 0.2s; }
.toggle input:checked + .toggle-slider { background: var(--accent); }
.toggle input:checked + .toggle-slider::after { transform: translateX(20px); }
/* Saved destinations list in settings */
.dest-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
.dest-item:last-child { border-bottom: none; }
.dest-item-icon { font-size: 20px; margin-right: 12px; flex-shrink: 0; }
.dest-item-info { flex: 1; min-width: 0; }
.dest-item-name { font-size: 14px; font-weight: 600; }
.dest-item-addr { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dest-item-del { background: none; border: none; color: var(--red); font-size: 18px; cursor: pointer; padding: 8px; }

@media (min-width: 768px) {
  #map .leaflet-control-zoom { bottom: 310px; }
  #map { bottom: 300px; } #panel { height: 300px; }
  #panel.expanded { height: 60vh; }
}
</style>
</head>
<body>

<!-- LANDING -->
<div id="landing">
  <button id="settings-gear" onclick="openSettings()">⚙️</button>
  <h1>⛽ Fuel Finder</h1>
  <p>Find the best value ULP95 near you.</p>
  <button class="landing-btn" onclick="startClosest()">
    <span class="icon">📍</span>
    <div>Closest<div class="sub">Best value stations near you</div></div>
  </button>
  <div id="enroute-container">
    <button class="landing-btn" id="enroute-btn" onclick="showEnrouteInput()">
      <span class="icon">🛣️</span>
      <div>En Route<div class="sub">Stations along your drive</div></div>
    </button>
    <div id="landing-dest-wrap">
      <input type="text" id="landing-dest-input" placeholder="Enter destination..." autocomplete="off" />
      <button id="landing-dest-cancel" onclick="hideEnrouteInput()">✕</button>
      <button id="landing-dest-submit" onclick="submitEnroute()">Go</button>
      <div id="landing-ac-list"></div>
    </div>
  </div>
  <p style="font-size:11px;color:var(--text-dim);margin-top:8px;max-width:260px">Real-time QLD fuel price data.</p>
</div>

<!-- SETTINGS OVERLAY / DRAWER -->
<div id="settings-overlay" onclick="closeSettings()"></div>
<div id="settings-drawer">
  <div id="settings-handle"></div>
  <div id="settings-header">
    <h2>Settings</h2>
    <button id="settings-close" onclick="closeSettings()">✕</button>
  </div>
  <div id="settings-body">
    <div id="settings-user-info" style="font-size:12px;color:var(--text-dim);margin-bottom:16px;"></div>

    <div class="setting-group">
      <div class="setting-group-title">Theme</div>
      <div class="setting-row">
        <div class="theme-chips">
          <button class="theme-chip" data-theme-value="light" onclick="setTheme('light')">☀️ Light</button>
          <button class="theme-chip" data-theme-value="dark" onclick="setTheme('dark')">🌙 Dark</button>
          <button class="theme-chip" data-theme-value="system" onclick="setTheme('system')">💻 System</button>
        </div>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-group-title">Destinations</div>
      <div id="saved-dest-list"><div style="color:var(--text-muted);font-size:13px;padding:8px 0;">Sign in to save destinations.</div></div>
      <button onclick="addNewDestination()" style="width:100%;margin-top:8px;background:var(--card);border:1px dashed var(--border);border-radius:var(--radius);padding:12px;color:var(--text-dim);font-size:13px;cursor:pointer;">+ Add saved destination</button>
    </div>

    <div class="setting-group">
      <div class="setting-group-title">Routing</div>
      <div class="setting-row">
        <div><div class="setting-label">Hide nearby destinations</div><div class="setting-desc">Don't show saved destinations within 1km of your current location</div></div>
        <label class="toggle"><input type="checkbox" id="hide-nearby-toggle" onchange="saveSetting('hide_nearby',this.checked)"><span class="toggle-slider"></span></label>
      </div>
    </div>
  </div>
</div>

<!-- TOP BAR -->
<div id="top-bar">
  <button id="back-btn" onclick="backToLanding()">←</button>
  <span id="mode-label">📍 Closest</span>
  <div id="dest-field">
    <input type="text" id="dest-input" placeholder="Destination..." autocomplete="off" />
    <button id="dest-go" onclick="goEnRoute()">Go</button>
    <div id="autocomplete-list"></div>
  </div>
</div>

<div id="loading"><div class="spinner"></div><span>Finding stations...</span></div>
<div id="toast"></div>
<div id="map"></div>

<div id="panel">
  <div id="panel-header">
    <span id="panel-title">Top Picks</span>
    <button id="panel-toggle">▲</button>
  </div>
  <div id="panel-body"></div>
</div>

<script>
// ════════════ SUPABASE ════════════
const SUPABASE_URL = 'https://skjgjkqeqmbvgzltwzij.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbG...WPOU';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ════════════ THEME SYSTEM ════════════
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('ff_theme', theme);
}
function getThemePreference() {
  return localStorage.getItem('ff_theme') || 'system';
}
function setTheme(theme) {
  applyTheme(theme);
  document.querySelectorAll('.theme-chip[data-theme-value]').forEach(c => c.classList.toggle('active', c.dataset.themeValue === theme));
  // Save to Supabase if logged in
  const email = getEmail();
  if (email) saveSetting('theme', theme);
}
// Listen for system theme changes
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
    if (getThemePreference() === 'system') applyTheme('system');
  });
}

// ════════════ USER IDENTITY (Cloudflare Access) ════════════
let userEmail = null;
let userDisplayName = null;
let userProfileId = null;

async function getIdentity() {
  try {
    const res = await fetch('/cdn-cgi/access/get-identity');
    if (!res.ok) throw new Error('no identity');
    const data = await res.json();
    userEmail = data.email || null;
    userDisplayName = data.name || data.email || null;
    return data;
  } catch (e) {
    // Fallback to localStorage identity
    userEmail = localStorage.getItem('ff_email') || null;
    userDisplayName = userEmail || null;
    return null;
  }
}

function getEmail() { return userEmail; }
function getDisplayName() { return userDisplayName || userEmail || 'You'; }

// ════════════ SUPABASE DATA ════════════
async function ensureProfile() {
  if (!userEmail) return null;
  // Upsert profile
  const { data: profile, error } = await sb.from('profiles').upsert(
    { email: userEmail, display_name: userDisplayName || userEmail },
    { onConflict: 'email', ignoreDuplicates: false }
  ).select('id').single();
  if (error) { console.warn('Profile error:', error); return null; }
  userProfileId = profile?.id;
  return profile;
}

async function loadDestinations() {
  if (!userEmail) return [];
  const { data } = await sb.from('destinations').select('*').order('created_at');
  return data || [];
}

async function saveDestination(name, address, lat, lon) {
  if (!userProfileId) await ensureProfile();
  if (!userProfileId) { showToast('Sign in required'); return null; }
  const { data, error } = await sb.from('destinations').insert({
    profile_id: userProfileId, name, address, lat, lon
  }).select().single();
  if (error) { showToast('Error saving: ' + error.message); return null; }
  return data;
}

async function deleteDestination(id) {
  const { error } = await sb.from('destinations').delete().eq('id', id);
  if (error) showToast('Error deleting: ' + error.message);
}

async function loadSettings() {
  if (!userEmail) return {};
  const { data } = await sb.from('user_settings').select('*').eq('profile_id', userProfileId).single();

}

// ════════════ OSRM ════════════
async function getDrivingDistances(origin, destinations) {
  if (!destinations.length) return [];
  const coords = origin.lon + ',' + origin.lat + ';' + destinations.map(s => s.lon + ',' + s.lat).join(';');
  try {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), OSRM_TIMEOUT);
    const res = await fetch(OSRM_BASE + '/table/v1/driving/' + coords + '?sources=0&annotations=distance', { signal: controller.signal });
    clearTimeout(id);
    if (!res.ok) throw new Error('OSRM ' + res.status);
    const data = await res.json();
    if (data.code !== 'Ok' || !data.distances) throw new Error('bad response');
    return destinations.map((s, i) => data.distances[0][i + 1] ? Math.round(data.distances[0][i + 1]) : null);
  } catch (e) {
    console.warn('OSRM fallback:', e.message);
    return destinations.map(s => Math.round(haversine(origin, s) * 1000));
  }
}

function haversine(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLon = (b.lon - a.lon) * Math.PI / 180;
  const lat1 = a.lat * Math.PI / 180, lat2 = b.lat * Math.PI / 180;
  return R * 2 * Math.atan2(Math.sqrt(Math.sin(dLat / 2) ** 2 + Math.sin(dLon / 2) ** 2 * Math.cos(lat1) * Math.cos(lat2)), Math.sqrt(1 - (Math.sin(dLat / 2) ** 2 + Math.sin(dLon / 2) ** 2 * Math.cos(lat1) * Math.cos(lat2))));
}

// ════════════ NET BENEFIT ════════════
function calcNetBenefit(stationsWithDist) {
  if (!stationsWithDist.length) return [];
  const sorted = [...stationsWithDist].sort((a, b) => a.driveM - b.driveM);
  const base = sorted[0];
  const baseCpl = (base.price || 159.9) / 100;

  return stationsWithDist.map(s => {
    const distKm = s.driveM / 1000;
    const extraKm = distKm - (base.driveM / 1000);
    const cpl = (s.price || 159.9) / 100;
    const fillSaving = (baseCpl - cpl) * VEHICLE.tankL;
    const benefit = fillSaving - (extraKm * VEHICLE.detourCostPerKm) - (extraKm * VEHICLE.consumption * cpl);
    return { ...s, driveKm: Math.round(distKm * 10) / 10, extraKm: Math.round(extraKm * 10) / 10, netBenefit: Math.round(benefit * 100) / 100, fillCost: Math.round(cpl * VEHICLE.tankL * 100) / 100 };
  }).sort((a, b) => b.netBenefit - a.netBenefit);
}

// ════════════ STATIONS (LOCAL JSON CACHE) ════════════
const DATA_CACHE_KEY = 'ff_stations_data';
const DATA_CACHE_MAX_AGE = 30 * 60 * 1000; // 30 min

async function fetchStations(lat, lon) {
  const userPt = { lat, lon };

  // Try loading from localStorage cache
  let stationsData = null;
  try {
    const raw = localStorage.getItem(DATA_CACHE_KEY);
    if (raw) {
      const entry = JSON.parse(raw);
      if (entry.ts && Date.now() - entry.ts < DATA_CACHE_MAX_AGE) {
        stationsData = entry.data;
      }
    }
  } catch {}

  // Fetch fresh data if cache expired
  if (!stationsData) {
    const res = await fetch(DATA_URL + '?_=' + Date.now());
    if (!res.ok) throw new Error('Data fetch: ' + res.status);
    stationsData = await res.json();
    try {
      localStorage.setItem(DATA_CACHE_KEY, JSON.stringify({ data: stationsData, ts: Date.now() }));
    } catch {}
  }

  // Filter by distance and date
  const now = Date.now();
  const fourteenDays = 14 * 24 * 3600 * 1000;
  const stations = [];

  for (const s of stationsData) {
    // Skip old prices
    if (now - Date.parse(s.t) > fourteenDays) continue;
    // Skip bad prices
    if (s.p < 50 || s.p > 500) continue;

    const dist = haversine(userPt, { lat: s.la, lon: s.lo });
    stations.push({
      name: s.n,
      address: s.a,
      lat: s.la,
      lon: s.lo,
      price: s.p,
      dist,
    });
  }

  // Filter to within 100km, sort by distance
  const nearby = stations.filter(s => s.dist < 100).sort((a, b) => a.dist - b.dist);

  // If too many for OSRM, take the 80 closest
  return nearby.length > 80 ? nearby.slice(0, 80) : nearby;
}

async function runRank(lat, lon) {
  showLoading(true);
  hideToast();
  userLoc = { lat, lon };

  try {
    stations = await fetchStations(lat, lon);
    if (!stations.length) { showToast('No stations found'); showLoading(false); return; }
    const pts = stations.map(s => ({ lat: s.lat, lon: s.lon }));
    const distances = await getDrivingDistances({ lat, lon }, pts);
    stations.forEach((s, i) => { s.driveM = distances[i] || Math.round(s.dist * 1000); });
    rankedStations = calcNetBenefit(stations);
    updateMap();
    updatePanel();
  } catch (e) { showToast('Error: ' + e.message); }
  showLoading(false);
}

// ════════════ PANEL ════════════
function updatePanel() {
  const body = document.getElementById('panel-body');
  const title = document.getElementById('panel-title');
  if (!rankedStations.length) { body.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-dim)">Searching...</div>'; return; }

  const best = rankedStations[0];
  const bestFillCost = '$' + best.fillCost.toFixed(2);
  title.textContent = '#1 ' + best.name + ' - Fill ' + bestFillCost;

  body.innerHTML = rankedStations.map((s, i) => {
    const rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : 'rank-3';
    let savingsClass = 'neutral', savingsText = 'Baseline';
    if (s.netBenefit > 0.5) { savingsClass = 'save'; savingsText = 'Save $' + s.netBenefit.toFixed(2); }
    else if (s.netBenefit > 0.01) { savingsClass = 'save'; savingsText = 'Save $' + s.netBenefit.toFixed(2); }
    else if (s.netBenefit < -0.01) { savingsClass = 'cost'; savingsText = 'Cost $' + Math.abs(s.netBenefit).toFixed(2); }

    return '<div class="station-card" onclick="focusStation(' + i + ')">'
      + '<div class="station-rank ' + rankClass + '">' + (i + 1) + '</div>'
      + '<div class="station-info">'
      + '<div class="station-name">' + s.name + '</div>'
      + '<div class="station-address">' + s.address + '</div>'
      + '<div class="station-savings ' + savingsClass + '">' + savingsText + '</div>'
      + '<div class="station-meta"><span>' + s.driveKm + ' km</span><span>$' + s.fillCost.toFixed(2) + '</span></div>'
      + '</div>'
      + '<button class="station-nav-btn" onclick="event.stopPropagation();navigateTo(\'' + s.address.replace(/'/g, "\\'") + '\')">Navigate</button>'
      + '</div>';
  }).join('');
}

function focusStation(index) {
  const s = rankedStations[index];
  if (s) {
    map.setView([s.lat, s.lon], 16);
    markers.forEach(m => { const ll = m.getLatLng(); if (Math.abs(ll.lat - s.lat) < 0.001 && Math.abs(ll.lng - s.lon) < 0.001) m.openPopup(); });
  }
}

// ════════════ EN ROUTE ════════════
async function submitEnroute() {
  const input = document.getElementById('landing-dest-input');
  const dest = input.value.trim();
  if (!dest) { showToast('Enter a destination'); return; }

  // Check if it's a saved destination
  let destLat, destLon, destName = dest;
  const savedMatch = savedDestinations.find(d => d.name.toLowerCase() === dest.toLowerCase());
  if (savedMatch) {
    destLat = savedMatch.lat; destLon = savedMatch.lon; destName = savedMatch.name;
  } else if (window._enrouteDest && window._enrouteDest.name === dest) {
    destLat = window._enrouteDest.lat; destLon = window._enrouteDest.lon;
  } else {
    // Geocode it
    showLoading(true);
    try {
      const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(dest + ', Brisbane QLD') + '&limit=1');
      const data = await res.json();
      if (!data.length) { showToast('Could not find that destination'); showLoading(false); return; }
      destLat = parseFloat(data[0].lat); destLon = parseFloat(data[0].lon);
      destName = data[0].display_name.split(',')[0];
    } catch (e) { showToast('Error: ' + e.message); showLoading(false); return; }
  }

  currentMode = 'enroute';
  document.getElementById('landing').classList.add('hidden');
  document.getElementById('top-bar').classList.add('visible');
  document.getElementById('mode-label').textContent = '🛣\uFE0F En Route';
  document.getElementById('dest-field').classList.add('visible');
  document.getElementById('dest-input').value = destName;
  showMapContent();
  window._enrouteName = destName;

  if (!navigator.geolocation) { showToast('Geolocation not supported'); showLoading(false); return; }
  navigator.geolocation.getCurrentPosition(
    pos => { runRank(pos.coords.latitude, pos.coords.longitude).then(() => { document.getElementById('panel-title').textContent = '🛣\uFE0F ' + destName + ' - Top Picks'; }); },
    err => { showToast('Location access denied'); },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

async function goEnRoute() {
  const input = document.getElementById('dest-input');

  if (!dest) { showToast('Enter a destination'); return; }
  if (!userLoc) { showToast('Allow location access first'); return; }

  document.getElementById('autocomplete-list').classList.remove('visible');

  try {
    const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(dest + ', Brisbane QLD') + '&limit=1');

      if (!data.length) { list.classList.remove('visible'); return; }
      list.innerHTML = data.map(p => {
        const name = p.display_name.split(',')[0];
        const sub = p.address ? (p.address.suburb || p.address.town || p.address.city || '') : '';
        return '<div onclick="document.getElementById(\'landing-dest-input\').value=\'' + name.replace(/'/g, "\\'") + '\';document.getElementById(\'landing-ac-list\').classList.remove(\'visible\');">'
          + '<div>' + name + '</div>' + (sub ? '<div class="ac-sub">' + sub + '</div>' : '') + '</div>';
      }).join('');
      list.classList.add('visible');
    } catch (e) {}
  }, 300);
});

// ════════════ UI HELPERS ════════════
function showLoading(show) { document.getElementById('loading').classList.toggle('visible', show); }
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('visible');
  setTimeout(() => el.classList.remove('visible'), 6000);
}
function hideToast() { document.getElementById('toast').classList.remove('visible'); }

// ════════════ INIT ════════════
document.addEventListener('DOMContentLoaded', async () => {
  // Theme
  applyTheme(getThemePreference());

  // Identity
  await getIdentity();
  if (userEmail) {
    await ensureProfile();
    await loadSettings();
    const dests = await loadDestinations();
    savedDestinations = dests;
  }

  initMap();

  document.getElementById('panel-toggle').onclick = () => {
    isExpanded = !isExpanded;
    document.getElementById('panel').classList.toggle('expanded', isExpanded);
    document.getElementById('panel-toggle').textContent = isExpanded ? '▼' : '▲';
    setTimeout(() => map.invalidateSize(), 300);
  };
  document.getElementById('dest-input').onkeydown = (e) => {
    if (e.key === 'Enter') { document.getElementById('autocomplete-list').classList.remove('visible'); goEnRoute(); }
  };
  document.getElementById('landing-dest-input').onkeydown = (e) => {
    if (e.key === 'Enter') { document.getElementById('landing-ac-list').classList.remove('visible'); submitEnroute(); }
  };
});
</script>
